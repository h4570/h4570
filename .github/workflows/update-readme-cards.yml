name: Update README cards
 
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=h4570&show_icons=true&theme=radical&include_all_commits=true&count_private=true&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}
 
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=h4570&layout=compact&theme=radical&hide_border=true&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}
 
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
 
